<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 200" role="img"
     aria-label="A timeline of one answer, in two parts. First a solid bar: the model reads the whole prompt at once, and nothing appears on screen. Then a row of small separate blocks: the model writes the answer one word at a time. A longer prompt stretches the first part. It also slows the second part a little.">
  <style>
    .rd  { fill: #38cfc6; }
    .tok { fill: #38cfc6; }
    .hd  { font: 12px system-ui, sans-serif; fill: #38cfc6; }
    .t   { font: 12px ui-monospace, Menlo, Consolas, monospace; fill: #93a7ab; }
    .m   { font: 11px ui-monospace, Menlo, Consolas, monospace; fill: #75898d; }
    .ar  { stroke: #44595e; stroke-width: 1.5; fill: none; }
    .cap { font: 11px system-ui, sans-serif; fill: #75898d; }
  </style>

  <text class="hd" x="20"  y="22">1. reading</text>
  <text class="t"  x="20"  y="44">the whole prompt, at once</text>
  <text class="hd" x="262" y="22">2. writing</text>
  <text class="t"  x="262" y="44">one word, then the next</text>

  <rect class="rd" x="20" y="62" width="230" height="28" rx="2"/>
  <rect class="tok" x="262" y="62" width="9" height="28" rx="1.5"/>
  <rect class="tok" x="276" y="62" width="9" height="28" rx="1.5"/>
  <rect class="tok" x="290" y="62" width="9" height="28" rx="1.5"/>
  <rect class="tok" x="304" y="62" width="9" height="28" rx="1.5"/>
  <rect class="tok" x="318" y="62" width="9" height="28" rx="1.5"/>
  <rect class="tok" x="332" y="62" width="9" height="28" rx="1.5"/>
  <rect class="tok" x="346" y="62" width="9" height="28" rx="1.5"/>
  <rect class="tok" x="360" y="62" width="9" height="28" rx="1.5"/>
  <rect class="tok" x="374" y="62" width="9" height="28" rx="1.5"/>
  <rect class="tok" x="388" y="62" width="9" height="28" rx="1.5"/>
  <rect class="tok" x="402" y="62" width="9" height="28" rx="1.5"/>
  <rect class="tok" x="416" y="62" width="9" height="28" rx="1.5"/>
  <rect class="tok" x="430" y="62" width="9" height="28" rx="1.5"/>
  <rect class="tok" x="444" y="62" width="9" height="28" rx="1.5"/>
  <rect class="tok" x="458" y="62" width="9" height="28" rx="1.5"/>
  <rect class="tok" x="472" y="62" width="9" height="28" rx="1.5"/>
  <rect class="tok" x="486" y="62" width="9" height="28" rx="1.5"/>
  <rect class="tok" x="500" y="62" width="9" height="28" rx="1.5"/>
  <rect class="tok" x="514" y="62" width="9" height="28" rx="1.5"/>
  <rect class="tok" x="528" y="62" width="9" height="28" rx="1.5"/>
  <rect class="tok" x="542" y="62" width="9" height="28" rx="1.5"/>
  <rect class="tok" x="556" y="62" width="9" height="28" rx="1.5"/>
  <rect class="tok" x="570" y="62" width="9" height="28" rx="1.5"/>
  <rect class="tok" x="584" y="62" width="9" height="28" rx="1.5"/>
  <rect class="tok" x="598" y="62" width="9" height="28" rx="1.5"/>
  <rect class="tok" x="612" y="62" width="9" height="28" rx="1.5"/>

  <text class="t" x="20"  y="114">nothing on screen yet</text>
  <text class="t" x="262" y="114">words appear at a steady pace</text>

  <line class="ar" x1="20"  y1="128" x2="20"  y2="142"/>
  <text class="m"  x="28"  y="140">you press enter</text>
  <line class="ar" x1="256" y1="128" x2="256" y2="142"/>
  <text class="m"  x="264" y="140">first word</text>

  <text class="cap" x="20" y="172">A longer prompt stretches the solid bar the most.</text>
  <text class="cap" x="20" y="190">It also spaces out the small blocks a little, because each new word looks back over all of it.</text>
</svg>
