<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 300" role="img"
     aria-label="Two columns comparing kill order. Before: desktop session at 200 is killed first, systemd --user at 100 second, llama-server at 0 last, so the twenty gigabyte model survives. After: llama-server at 500 is killed first, then desktop session at 200, then systemd --user at 100.">
  <style>
    .hd   { font: 12px system-ui, sans-serif; fill: #93a7ab; }
    .nm   { font: 12px ui-monospace, Menlo, Consolas, monospace; fill: #93a7ab; }
    .sc   { font: 12px ui-monospace, Menlo, Consolas, monospace; fill: #93a7ab; text-anchor: end; }
    .nmA  { font: 12px ui-monospace, Menlo, Consolas, monospace; fill: #0c1317; }
    .scA  { font: 12px ui-monospace, Menlo, Consolas, monospace; fill: #0c1317; text-anchor: end; }
    .box  { fill: none; stroke: #22333a; stroke-width: 1; }
    .hot  { fill: #38cfc6; }
    .ord  { font: 10px system-ui, sans-serif; fill: #6a7d81; text-anchor: middle; }
    .arw  { stroke: #44595e; stroke-width: 1.5; fill: none; }
    .cap  { font: 11px system-ui, sans-serif; fill: #6a7d81; }
  </style>

  <text class="ord" x="14" y="76" transform="rotate(-90 14 76)">first</text>
  <text class="ord" x="14" y="212" transform="rotate(-90 14 212)">last</text>
  <line class="arw" x1="14" y1="96" x2="14" y2="186"/>
  <path class="arw" d="M10 180 L14 188 L18 180"/>

  <text class="hd" x="30"  y="42">before</text>
  <rect class="box" x="30"  y="56"  width="250" height="44" rx="3"/>
  <text class="nm"  x="44"  y="83">desktop session</text>
  <text class="sc"  x="266" y="83">200</text>
  <rect class="box" x="30"  y="116" width="250" height="44" rx="3"/>
  <text class="nm"  x="44"  y="143">systemd --user</text>
  <text class="sc"  x="266" y="143">100</text>
  <rect class="hot" x="30"  y="176" width="250" height="44" rx="3"/>
  <text class="nmA" x="44"  y="203">llama-server, 20GB</text>
  <text class="scA" x="266" y="203">0</text>

  <line class="arw" x1="300" y1="138" x2="340" y2="138"/>
  <path class="arw" d="M334 133 L341 138 L334 143"/>

  <text class="hd" x="360" y="42">after</text>
  <rect class="hot" x="360" y="56"  width="250" height="44" rx="3"/>
  <text class="nmA" x="374" y="83">llama-server, 20GB</text>
  <text class="scA" x="596" y="83">500</text>
  <rect class="box" x="360" y="116" width="250" height="44" rx="3"/>
  <text class="nm"  x="374" y="143">desktop session</text>
  <text class="sc"  x="596" y="143">200</text>
  <rect class="box" x="360" y="176" width="250" height="44" rx="3"/>
  <text class="nm"  x="374" y="203">systemd --user</text>
  <text class="sc"  x="596" y="203">100</text>

  <text class="cap" x="30" y="258">One line of config moves the expensive, restartable thing to the top.</text>
  <text class="cap" x="30" y="276">Everything underneath it is something you would rather keep.</text>
</svg>
