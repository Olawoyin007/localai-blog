<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 260" role="img"
     aria-label="Bar chart. Bytes read per token for three models, with measured speed alongside. qwen3.8-27b reads 29 GB and runs at 7.8 tokens per second. qwen3.5-122b reads about 15 GB and runs at 13 to 25. glm-4.7-flash reads about 2 GB and runs at 42.">
  <style>
    .lbl  { font: 13px ui-monospace, Menlo, Consolas, monospace; fill: #e7eff0; }
    .unit { font: 12px ui-monospace, Menlo, Consolas, monospace; fill: #93a7ab; }
    .spd  { font: 13px ui-monospace, Menlo, Consolas, monospace; fill: #7fe4dd; }
    .cap  { font: 11px system-ui, sans-serif; fill: #6a7d81; }
    .bar  { fill: #38cfc6; }
    .axis { stroke: #22333a; stroke-width: 1; }
  </style>

  <text class="cap" x="0" y="12">bytes read per token</text>
  <text class="cap" x="640" y="12" text-anchor="end">measured</text>

  <!-- qwen3.8-27b : 29 GB -->
  <text class="lbl"  x="0"   y="54">qwen3.8-27b</text>
  <text class="unit" x="0"   y="70">dense 27B</text>
  <rect class="bar"  x="150" y="40" width="330" height="22" rx="2"/>
  <text class="unit" x="490" y="56">29 GB</text>
  <text class="spd"  x="640" y="56" text-anchor="end">7.8 tok/s</text>

  <!-- qwen3.5-122b : ~15 GB -->
  <text class="lbl"  x="0"   y="124">qwen3.5-122b</text>
  <text class="unit" x="0"   y="140">MoE, 10B active</text>
  <rect class="bar"  x="150" y="110" width="171" height="22" rx="2"/>
  <text class="unit" x="331" y="126">~15 GB</text>
  <text class="spd"  x="640" y="126" text-anchor="end">13-25 tok/s</text>

  <!-- glm-4.7-flash : ~2 GB -->
  <text class="lbl"  x="0"   y="194">glm-4.7-flash</text>
  <text class="unit" x="0"   y="210">MoE, 3B active</text>
  <rect class="bar"  x="150" y="180" width="23" height="22" rx="2"/>
  <text class="unit" x="183" y="196">~2 GB</text>
  <text class="spd"  x="640" y="196" text-anchor="end">42 tok/s</text>

  <line class="axis" x1="150" y1="30" x2="150" y2="215"/>
  <text class="cap" x="150" y="243">Shorter bar, faster answer. Parameter count is not in this picture.</text>
</svg>
