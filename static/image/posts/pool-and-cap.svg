<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 230" role="img"
     aria-label="Two bars of identical width representing the same 15 GiB pool. The upper bar at a 16,384 token cap divides into about 45 slices. The lower bar at a 32,768 token cap divides into about 28. The pool does not change size.">
  <style>
    .hd  { font: 12px ui-monospace, Menlo, Consolas, monospace; fill: #e7eff0; }
    .mut { font: 11px system-ui, sans-serif; fill: #93a7ab; }
    .cap { font: 11px system-ui, sans-serif; fill: #6a7d81; }
    .pool{ fill: none; stroke: #38cfc6; stroke-width: 1.5; }
    .sl  { stroke: #22333a; stroke-width: 1; }
    .one { fill: #38cfc6; }
  </style>

  <text class="hd"  x="0" y="34">cap 16,384</text>
  <rect class="pool" x="110" y="20" width="450" height="34" rx="2"/>
  <g class="sl">
    <line x1="120" y1="20" x2="120" y2="54"/><line x1="130" y1="20" x2="130" y2="54"/><line x1="140" y1="20" x2="140" y2="54"/><line x1="150" y1="20" x2="150" y2="54"/>
    <line x1="160" y1="20" x2="160" y2="54"/><line x1="170" y1="20" x2="170" y2="54"/><line x1="180" y1="20" x2="180" y2="54"/><line x1="190" y1="20" x2="190" y2="54"/>
    <line x1="200" y1="20" x2="200" y2="54"/><line x1="210" y1="20" x2="210" y2="54"/><line x1="220" y1="20" x2="220" y2="54"/><line x1="230" y1="20" x2="230" y2="54"/>
    <line x1="240" y1="20" x2="240" y2="54"/><line x1="250" y1="20" x2="250" y2="54"/><line x1="260" y1="20" x2="260" y2="54"/><line x1="270" y1="20" x2="270" y2="54"/>
    <line x1="280" y1="20" x2="280" y2="54"/><line x1="290" y1="20" x2="290" y2="54"/><line x1="300" y1="20" x2="300" y2="54"/><line x1="310" y1="20" x2="310" y2="54"/>
    <line x1="320" y1="20" x2="320" y2="54"/><line x1="330" y1="20" x2="330" y2="54"/><line x1="340" y1="20" x2="340" y2="54"/><line x1="350" y1="20" x2="350" y2="54"/>
    <line x1="360" y1="20" x2="360" y2="54"/><line x1="370" y1="20" x2="370" y2="54"/><line x1="380" y1="20" x2="380" y2="54"/><line x1="390" y1="20" x2="390" y2="54"/>
    <line x1="400" y1="20" x2="400" y2="54"/><line x1="410" y1="20" x2="410" y2="54"/><line x1="420" y1="20" x2="420" y2="54"/><line x1="430" y1="20" x2="430" y2="54"/>
    <line x1="440" y1="20" x2="440" y2="54"/><line x1="450" y1="20" x2="450" y2="54"/><line x1="460" y1="20" x2="460" y2="54"/><line x1="470" y1="20" x2="470" y2="54"/>
    <line x1="480" y1="20" x2="480" y2="54"/><line x1="490" y1="20" x2="490" y2="54"/><line x1="500" y1="20" x2="500" y2="54"/><line x1="510" y1="20" x2="510" y2="54"/>
    <line x1="520" y1="20" x2="520" y2="54"/><line x1="530" y1="20" x2="530" y2="54"/><line x1="540" y1="20" x2="540" y2="54"/><line x1="550" y1="20" x2="550" y2="54"/>
  </g>
  <rect class="one" x="110" y="20" width="10" height="34"/>
  <text class="mut" x="570" y="42">45 fit</text>

  <text class="hd"  x="0" y="116">cap 32,768</text>
  <rect class="pool" x="110" y="102" width="450" height="34" rx="2"/>
  <g class="sl">
    <line x1="126" y1="102" x2="126" y2="136"/><line x1="142" y1="102" x2="142" y2="136"/><line x1="158" y1="102" x2="158" y2="136"/><line x1="174" y1="102" x2="174" y2="136"/>
    <line x1="190" y1="102" x2="190" y2="136"/><line x1="206" y1="102" x2="206" y2="136"/><line x1="222" y1="102" x2="222" y2="136"/><line x1="238" y1="102" x2="238" y2="136"/>
    <line x1="254" y1="102" x2="254" y2="136"/><line x1="270" y1="102" x2="270" y2="136"/><line x1="286" y1="102" x2="286" y2="136"/><line x1="302" y1="102" x2="302" y2="136"/>
    <line x1="318" y1="102" x2="318" y2="136"/><line x1="334" y1="102" x2="334" y2="136"/><line x1="350" y1="102" x2="350" y2="136"/><line x1="366" y1="102" x2="366" y2="136"/>
    <line x1="382" y1="102" x2="382" y2="136"/><line x1="398" y1="102" x2="398" y2="136"/><line x1="414" y1="102" x2="414" y2="136"/><line x1="430" y1="102" x2="430" y2="136"/>
    <line x1="446" y1="102" x2="446" y2="136"/><line x1="462" y1="102" x2="462" y2="136"/><line x1="478" y1="102" x2="478" y2="136"/><line x1="494" y1="102" x2="494" y2="136"/>
    <line x1="510" y1="102" x2="510" y2="136"/><line x1="526" y1="102" x2="526" y2="136"/><line x1="542" y1="102" x2="542" y2="136"/>
  </g>
  <rect class="one" x="110" y="102" width="16" height="34"/>
  <text class="mut" x="570" y="124">28 fit</text>

  <text class="cap" x="0" y="174">Both bars are the same 15 GiB pool. Raising the cap did not grow it.</text>
  <text class="cap" x="0" y="192">It only made each conversation's slice bigger. The filled block is one conversation.</text>
  <text class="cap" x="0" y="210">Growing the bar itself is the other knob, and that one costs real memory.</text>
</svg>
